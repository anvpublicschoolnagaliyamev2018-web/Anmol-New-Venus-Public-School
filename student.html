<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#102b63"><title>ANVPS Student Portal</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f6fc;color:#17233b;font-family:Arial,sans-serif}header{background:linear-gradient(120deg,#091c42,#174a9b);border-bottom:4px solid #f5bd35;color:white;padding:22px max(16px,calc((100% - 1000px)/2))}header h1{margin:0 0 6px;font-size:22px}header p{margin:0;color:#dce7ff}main{max-width:1000px;margin:24px auto;padding:0 14px 40px}.card{background:white;border:1px solid #dce4f1;border-radius:14px;padding:20px;margin-bottom:16px;box-shadow:0 5px 22px #102b630c}h2,h3{color:#102b63;margin-top:0}label{display:block;margin:12px 0 6px;font-weight:bold}input{width:100%;padding:12px;border:1px solid #ccd5e4;border-radius:8px;font:inherit}button,.btn{display:inline-block;border:0;border-radius:8px;padding:11px 15px;background:#174a9b;color:white;font-weight:bold;cursor:pointer;text-decoration:none}.secondary{background:#e7edf8;color:#102b63}.hidden{display:none!important}.muted{color:#687790;font-size:13px;line-height:1.5}.item{border:1px solid #dce4f1;border-radius:10px;background:#f7f9fd;padding:15px;margin:12px 0}.item p{line-height:1.5}.admit-card{border:2px solid #102b63;padding:22px;margin:15px 0;background:#fff;color:#102b63;break-inside:avoid}.school-logo{display:block;width:65px;height:65px;object-fit:contain;margin:0 auto 8px}.admit-card h2,.admit-card h3{text-align:center;margin:7px}.admit-card hr{border:0;border-top:1px solid #ccd5e4;margin:14px 0}.row{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.signatures{display:flex;justify-content:space-between;gap:20px;margin-top:45px;text-align:center;font-size:12px}.signatures span{border-top:1px solid #102b63;padding-top:7px}@media print{body *{visibility:hidden!important}#cards,#cards *{visibility:visible!important}#cards{position:absolute;left:0;top:0;width:100%}.admit-card{page-break-after:always;break-after:page}@page{size:A4 portrait;margin:12mm}}
</style></head><body><header><h1>ANMOL NEW VENUS PUBLIC SCHOOL</h1><p>Student Portal · Session 2026–27</p></header><main>
<section class="card" id="loginCard"><h2>Student Login</h2><p class="muted">Use the email and password issued for your student account.</p><form id="loginForm"><label for="email">Student Email</label><input id="email" type="email" required autocomplete="username"><label for="password">Password</label><input id="password" type="password" required autocomplete="current-password"><p><button id="loginBtn">Login</button></p></form><p id="loginStatus" role="status"></p><a href="index.html">← Back to School Website</a></section>
<section class="hidden" id="portal"><div class="card"><p id="studentWelcome"></p><button id="refreshBtn" class="secondary">Refresh</button> <button id="logoutBtn" class="secondary">Logout</button><p id="portalStatus" role="status"></p></div><section class="card"><h2>My Admit Cards</h2><p class="muted">Only cards published for your signed-in account are shown here.</p><div id="cards">Loading…</div><button id="printBtn" class="secondary">Print / Save visible cards as PDF</button></section></section>
</main>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";
import{getAuth,signInWithEmailAndPassword,onAuthStateChanged,signOut}from"https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";
import{getFirestore,collection,getDocs,query,where}from"https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";
const cfg={apiKey:"AIzaSyDPQNf38Abzi01ysHey5GDPa77NIALHnw0",authDomain:"anv-public-school.firebaseapp.com",projectId:"anv-public-school",appId:"1:549207509375:web:efe695091a65f84992b24a"};
const app=initializeApp(cfg),auth=getAuth(app),db=getFirestore(app),$=id=>document.getElementById(id);
function msg(id,s){$(id).textContent=s}function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
$("loginForm").addEventListener("submit",async e=>{e.preventDefault();$("loginBtn").disabled=true;msg("loginStatus","Signing in…");try{await signInWithEmailAndPassword(auth,$("email").value.trim(),$("password").value);$("password").value="";msg("loginStatus","")}catch(err){msg("loginStatus",err.code==="auth/invalid-credential"?"Email or password is incorrect.":"Login failed: "+err.message)}finally{$("loginBtn").disabled=false}});
onAuthStateChanged(auth,async user=>{if(!user){$("loginCard").classList.remove("hidden");$("portal").classList.add("hidden");return}$("loginCard").classList.add("hidden");$("portal").classList.remove("hidden");$("studentWelcome").textContent="Signed in as "+(user.email||"student");await loadCards(user).catch(err=>{msg("portalStatus","Unexpected error: "+err.message);const box=$("cards");box.textContent="Admit cards could not load. Contact the school office.";console.error(err)})});
async function loadCards(user){msg("portalStatus","Loading published admit cards…");try{const snap=await getDocs(query(collection(db,"admitCards"),where("studentUid","==",user.uid),where("published","==",true)));const list=snap.docs.map(d=>d.data()).sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0));const box=$("cards");box.replaceChildren();if(!list.length){box.textContent="No admit cards have been published for your account yet.";msg("portalStatus","");return}list.forEach(s=>{const a=document.createElement("article");a.className="admit-card";a.innerHTML=`<img class="school-logo" src="6751.gif" alt="School logo"><h2>ANMOL NEW VENUS PUBLIC SCHOOL</h2><h3>Nagaliya Mev, Gajraula, Amroha, Uttar Pradesh</h3><h3>Session ${esc(s.session)}</h3><hr><h2>ADMIT CARD</h2><h3>${esc(s.examType)}</h3><p><b>Examination:</b> ${esc(s.examTitle)}</p><div class="row"><span><b>Class:</b> ${esc(s.studentClass)}</span><span><b>Roll No.:</b> ${esc(s.rollNumber)}</span></div><hr><p><b>Student Name:</b> ${esc(s.studentName)}</p><p><b>Admission No.:</b> ${esc(s.admissionNumber)}</p><p><b>Parent / Guardian:</b> ${esc(s.parentName||"—")}</p><p><b>Exam Start:</b> ${esc(s.startDate)}</p><p><b>Exam End:</b> ${esc(s.endDate)}</p><hr><p><b>Instructions:</b> ${esc(s.instructions)}</p><div class="signatures"><span>Parent Signature</span><span>Class Teacher</span><span>Principal</span></div>`;box.append(a)});msg("portalStatus",`${list.length} admit card(s) found.`)}catch(err){const box=$("cards");box.replaceChildren();box.textContent="Admit cards could not load. Please refresh or contact the school office.";msg("portalStatus","Error: "+(err.code?err.code+" — ":"")+err.message+". Check Firestore rules and student UID linkage.");console.error(err)}}
$("refreshBtn").onclick=()=>{if(auth.currentUser)loadCards(auth.currentUser)};$("logoutBtn").onclick=()=>signOut(auth);$("printBtn").onclick=()=>window.print();
</script></body></html>
