
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#102b63">
  <title>ANVPS Admin Login</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; padding: 20px;
      display: grid; place-items: center;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg,#091c42,#174a9b);
      color: #26334a;
    }
    .card {
      width: 100%; max-width: 420px; padding: 30px;
      border-radius: 20px; background: white;
      box-shadow: 0 20px 60px #0003;
    }
    h1 { color: #102b63; margin-top: 0; }
    p { color: #66748a; }
    label { display: block; margin: 16px 0 6px; font-weight: bold; }
    input {
      width: 100%; padding: 13px; border: 1px solid #ccd5e4;
      border-radius: 10px; font-size: 16px;
    }
    button {
      width: 100%; padding: 13px; margin-top: 18px;
      border: 0; border-radius: 10px; cursor: pointer;
      color: white; background: #174a9b; font-size: 16px;
      font-weight: bold;
    }
    button:disabled { opacity: .6; cursor: wait; }
    #status { overflow-wrap: anywhere; font-size: 14px; }
    .hidden { display: none !important; }
    .back { display: block; margin-top: 20px; color: #174a9b; }
  </style>
</head>
<body>
  <main class="card">
    <h1>ANVPS Admin</h1>
    <p>ANMOL NEW VENUS PUBLIC SCHOOL</p>

    <form id="loginForm">
      <label for="email">Admin Email</label>
      <input id="email" type="email" autocomplete="username"
             required>

      <label for="password">Password</label>
      <input id="password" type="password"
             autocomplete="current-password" required>

      <button id="loginButton" type="submit">Secure Login</button>
    </form>

    <section id="dashboard" class="hidden">
      <h2>Login Successful</h2>
      <p id="adminEmail"></p>
      <p>Firebase authentication successful hai.</p>
      <button id="logoutButton" type="button">Logout</button>
    </section>

    <p id="status" role="status" aria-live="polite"></p>
    <a class="back" href="index.html">← Back to School Website</a>
  </main>

  <script type="module">
    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";

    import {
      getAuth, signInWithEmailAndPassword,
      onAuthStateChanged, signOut
    } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";

    // Firebase console ke Config option se apni values bharein.
    const firebaseConfig = {
      apiKey: "AIzaSyDPQNf38Abzi01ysHey5GDPa77NIALHnw0",
      authDomain: "anv-public-school.firebaseapp.com",
      projectId: "anv-public-school",
      appId: "1:549207509375:web:efe695091a65f84992b24a"
    };

    // Yahan wahi email likhein jo Firebase Users mein admin ke liye banayi.
    const ADMIN_EMAIL = "anvpublicschoolnagaliyamev2018@gmail.com";

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const form = document.getElementById("loginForm");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const loginButton = document.getElementById("loginButton");
    const dashboard = document.getElementById("dashboard");
    const adminEmail = document.getElementById("adminEmail");
    const status = document.getElementById("status");

    function showDashboard(user) {
      form.classList.add("hidden");
      dashboard.classList.remove("hidden");
      adminEmail.textContent = "Signed in as: " + user.email;
    }

    function showLogin() {
      dashboard.classList.add("hidden");
      form.classList.remove("hidden");
      passwordInput.value = "";
    }

    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        showLogin();
        return;
      }

      if ((user.email || "").toLowerCase() !==
          ADMIN_EMAIL.toLowerCase()) {
        await signOut(auth);
        showLogin();
        status.textContent = "Is account ko admin access nahi hai.";
        return;
      }

      showDashboard(user);
      status.textContent = "";
    });

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      loginButton.disabled = true;
      status.textContent = "Signing in...";

      try {
        const email = emailInput.value.trim().toLowerCase();

        if (email !== ADMIN_EMAIL.toLowerCase()) {
          throw new Error("Admin email match nahi karta.");
        }

        await signInWithEmailAndPassword(
          auth, email, passwordInput.value
        );

        status.textContent = "Login successful.";
      } catch (error) {
        const messages = {
          "auth/invalid-credential":
            "Email ya password sahi nahi hai.",
          "auth/too-many-requests":
            "Bahut attempts hue. Kuch der baad try karein.",
          "auth/network-request-failed":
            "Internet connection check karein."
        };

        status.textContent =
          messages[error.code] || error.message ||
          "Login nahi ho saka. Settings check karein.";
      } finally {
        loginButton.disabled = false;
      }
    });

    document.getElementById("logoutButton")
      .addEventListener("click", async () => {
        try {
          await signOut(auth);
          status.textContent = "Logout successful.";
        } catch {
          status.textContent = "Logout nahi ho saka.";
        }
      });
  </script>
</body>
</html>
